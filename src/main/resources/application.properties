quarkus.http.port=${PORT:8082}

# Security
quarkus.http.auth.proactive=false

# Vaadin
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.sbsolutions
vaadin.devserver.open-browser=false
vaadin.production-mode=false
vaadin.servlet.check-before-login=false
vaadin.urlMapping=/*

# HTTP compression
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# Health
quarkus.smallrye-health.liveness.enabled=true
quarkus.smallrye-health.readiness.enabled=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.sbsolutions".level=DEBUG
quarkus.log.category."org.atmosphere".level=WARN
quarkus.log.category."com.vaadin".level=DEBUG
quarkus.log.category."io.quarkus.undertow".level=DEBUG
quarkus.log.category."io.undertow".level=DEBUG

# Order Data service
ORDER_DATA_REST_URL=https://order-data.fly.dev

# Application configuration
app.time-zone=America/Chicago

# Dev profile equivalent
%dev.ORDER_DATA_REST_URL=https://order-data.fly.dev
